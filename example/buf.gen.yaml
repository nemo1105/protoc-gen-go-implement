version: v2
managed:
  enabled: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen
    opt:
      - paths=source_relative

  # multi files grpc
  - local: protoc-gen-go-implement
    out: gen
    opt:
      - paths=source_relative
      - package_suffix=multi
      - services_suffix=.svc.go
      - rpc_suffix=.rpc.go
      - impl_suffix=ServiceImplement
      - split=true
      - target=grpc
  # single file grpc
  - local: protoc-gen-go-implement
    out: gen
    opt:
      - paths=source_relative
      - single_suffix=.impl_all_in_one.go
      - target=grpc

  - remote: buf.build/connectrpc/go
    out: gen
    opt:
      - paths=source_relative
  # multi files connect
  - local: protoc-gen-go-implement
    out: gen
    opt:
      - out=gen
      - paths=source_relative
      - package_suffix=multi_connect
      - services_suffix=.svc.go
      - rpc_suffix=.rpc.go
      - impl_suffix=ServiceImplement
      - split=true
      - target=connect
      - register=true
  # single file
  - local: protoc-gen-go-implement
    out: gen
    opt:
      - paths=source_relative
      - package_suffix=single_connect
      - single_suffix=.impl_all_in_one_connect.go
      - target=connect


